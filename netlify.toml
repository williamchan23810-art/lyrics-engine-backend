# netlify.toml
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Serverless function proxy rewrites
[[redirects]]
  from = "/api/grab-lyrics"
  to = "/.netlify/functions/grab-lyrics"
  status = 200

[[redirects]]
  from = "/api/storyboard"
  to = "/.netlify/functions/storyboard"
  status = 200

# SPA fallback router (must remain at the bottom)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
